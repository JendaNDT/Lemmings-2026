name: Kontroly hry

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    name: Godot 4.7 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt
      - name: Nástroje GDScriptu
        run: python -m pip install -r scripts/requirements-dev.txt
      - name: Ověřený Godot
        shell: bash
        run: |
          python scripts/install_godot.py > godot-path.txt
          printf 'GODOT_BIN=%s\n' "$(cat godot-path.txt)" >> "$GITHUB_ENV"
      - name: Import, pravidla, replay a hlavní scéna
        run: python scripts/check.py
      - name: Protokoly kontrol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.os }}
          path: build/checks/
          if-no-files-found: warn
